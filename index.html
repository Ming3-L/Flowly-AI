<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerCompass - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.378.0"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
            background: '#FFFFFF',
            foreground: '#111827',
            muted: '#F3F4F6',
            'muted-foreground': '#6B7280',
            border: '#E5E7EB',
            destructive: '#EF4444',
          },
        },
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .bg-grid-white {
      background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Pupil component
    const Pupil = ({ size = 12, maxDistance = 5, pupilColor = "black", forceLookX, forceLookY }) => {
      const [mouseX, setMouseX] = useState(0);
      const [mouseY, setMouseY] = useState(0);
      const pupilRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMouseX(e.clientX);
          setMouseY(e.clientY);
        };

        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, []);

      const calculatePupilPosition = () => {
        if (!pupilRef.current) return { x: 0, y: 0 };

        if (forceLookX !== undefined && forceLookY !== undefined) {
          return { x: forceLookX, y: forceLookY };
        }

        const pupil = pupilRef.current.getBoundingClientRect();
        const pupilCenterX = pupil.left + pupil.width / 2;
        const pupilCenterY = pupil.top + pupil.height / 2;

        const deltaX = mouseX - pupilCenterX;
        const deltaY = mouseY - pupilCenterY;
        const distance = Math.min(Math.sqrt(deltaX ** 2 + deltaY ** 2), maxDistance);

        const angle = Math.atan2(deltaY, deltaX);
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        return { x, y };
      };

      const pupilPosition = calculatePupilPosition();

      return (
        <div
          ref={pupilRef}
          className="rounded-full"
          style={{
            width: `${size}px`,
            height: `${size}px`,
            backgroundColor: pupilColor,
            transform: `translate(${pupilPosition.x}px, ${pupilPosition.y}px)`,
            transition: 'transform 0.1s ease-out',
          }}
        />
      );
    };

    // EyeBall component
    const EyeBall = ({ size = 48, pupilSize = 16, maxDistance = 10, eyeColor = "white", pupilColor = "black", isBlinking = false, forceLookX, forceLookY }) => {
      const [mouseX, setMouseX] = useState(0);
      const [mouseY, setMouseY] = useState(0);
      const eyeRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMouseX(e.clientX);
          setMouseY(e.clientY);
        };

        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, []);

      const calculatePupilPosition = () => {
        if (!eyeRef.current) return { x: 0, y: 0 };

        if (forceLookX !== undefined && forceLookY !== undefined) {
          return { x: forceLookX, y: forceLookY };
        }

        const eye = eyeRef.current.getBoundingClientRect();
        const eyeCenterX = eye.left + eye.width / 2;
        const eyeCenterY = eye.top + eye.height / 2;

        const deltaX = mouseX - eyeCenterX;
        const deltaY = mouseY - eyeCenterY;
        const distance = Math.min(Math.sqrt(deltaX ** 2 + deltaY ** 2), maxDistance);

        const angle = Math.atan2(deltaY, deltaX);
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        return { x, y };
      };

      const pupilPosition = calculatePupilPosition();

      return (
        <div
          ref={eyeRef}
          className="rounded-full flex items-center justify-center transition-all duration-150"
          style={{
            width: `${size}px`,
            height: isBlinking ? '2px' : `${size}px`,
            backgroundColor: eyeColor,
            overflow: 'hidden',
          }}
        >
          {!isBlinking && (
            <div
              className="rounded-full"
              style={{
                width: `${pupilSize}px`,
                height: `${pupilSize}px`,
                backgroundColor: pupilColor,
                transform: `translate(${pupilPosition.x}px, ${pupilPosition.y}px)`,
                transition: 'transform 0.1s ease-out',
              }}
            />
          )}
        </div>
      );
    };

    // AnimatedCharacters component
    const AnimatedCharacters = ({ isTyping = false, showPassword = false, passwordLength = 0 }) => {
      const [mouseX, setMouseX] = useState(0);
      const [mouseY, setMouseY] = useState(0);
      const [isPurpleBlinking, setIsPurpleBlinking] = useState(false);
      const [isBlackBlinking, setIsBlackBlinking] = useState(false);
      const [isLookingAtEachOther, setIsLookingAtEachOther] = useState(false);
      const [isPurplePeeking, setIsPurplePeeking] = useState(false);
      const purpleRef = useRef(null);
      const blackRef = useRef(null);
      const yellowRef = useRef(null);
      const orangeRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMouseX(e.clientX);
          setMouseY(e.clientY);
        };

        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, []);

      // Blinking effect for purple character
      useEffect(() => {
        const getRandomBlinkInterval = () => Math.random() * 4000 + 3000;

        const scheduleBlink = () => {
          const blinkTimeout = setTimeout(() => {
            setIsPurpleBlinking(true);
            setTimeout(() => {
              setIsPurpleBlinking(false);
              scheduleBlink();
            }, 150);
          }, getRandomBlinkInterval());

          return blinkTimeout;
        };

        const timeout = scheduleBlink();
        return () => clearTimeout(timeout);
      }, []);

      // Blinking effect for black character
      useEffect(() => {
        const getRandomBlinkInterval = () => Math.random() * 4000 + 3000;

        const scheduleBlink = () => {
          const blinkTimeout = setTimeout(() => {
            setIsBlackBlinking(true);
            setTimeout(() => {
              setIsBlackBlinking(false);
              scheduleBlink();
            }, 150);
          }, getRandomBlinkInterval());

          return blinkTimeout;
        };

        const timeout = scheduleBlink();
        return () => clearTimeout(timeout);
      }, []);

      // Looking at each other animation when typing starts
      useEffect(() => {
        if (isTyping) {
          setIsLookingAtEachOther(true);
          const timer = setTimeout(() => {
            setIsLookingAtEachOther(false);
          }, 800);
          return () => clearTimeout(timer);
        } else {
          setIsLookingAtEachOther(false);
        }
      }, [isTyping]);

      // Purple sneaky peeking animation when typing password and it's visible
      useEffect(() => {
        if (passwordLength > 0 && showPassword) {
          const schedulePeek = () => {
            const peekInterval = setTimeout(() => {
              setIsPurplePeeking(true);
              setTimeout(() => {
                setIsPurplePeeking(false);
              }, 800);
            }, Math.random() * 3000 + 2000);
            return peekInterval;
          };

          const firstPeek = schedulePeek();
          return () => clearTimeout(firstPeek);
        } else {
          setIsPurplePeeking(false);
        }
      }, [passwordLength, showPassword, isPurplePeeking]);

      const calculatePosition = (ref) => {
        if (!ref.current) return { faceX: 0, faceY: 0, bodySkew: 0 };

        const rect = ref.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 3;

        const deltaX = mouseX - centerX;
        const deltaY = mouseY - centerY;

        const faceX = Math.max(-15, Math.min(15, deltaX / 20));
        const faceY = Math.max(-10, Math.min(10, deltaY / 30));
        const bodySkew = Math.max(-6, Math.min(6, -deltaX / 120));

        return { faceX, faceY, bodySkew };
      };

      const purplePos = calculatePosition(purpleRef);
      const blackPos = calculatePosition(blackRef);
      const yellowPos = calculatePosition(yellowRef);
      const orangePos = calculatePosition(orangeRef);

      const isHidingPassword = passwordLength > 0 && !showPassword;

      return (
        <div className="relative" style={{ width: '550px', height: '400px' }}>
          {/* Purple tall rectangle character - Back layer */}
          <div 
            ref={purpleRef}
            className="absolute bottom-0 transition-all duration-700 ease-in-out"
            style={{
              left: '70px',
              width: '180px',
              height: (isTyping || isHidingPassword) ? '440px' : '400px',
              backgroundColor: '#6C3FF5',
              borderRadius: '10px 10px 0 0',
              zIndex: 1,
              transform: (passwordLength > 0 && showPassword)
                ? `skewX(0deg)`
                : (isTyping || isHidingPassword)
                  ? `skewX(${(purplePos.bodySkew || 0) - 12}deg) translateX(40px)` 
                  : `skewX(${purplePos.bodySkew || 0}deg)`,
              transformOrigin: 'bottom center',
            }}
          >
            {/* Eyes */}
            <div 
              className="absolute flex gap-8 transition-all duration-700 ease-in-out"
              style={{
                left: (passwordLength > 0 && showPassword) ? `${20}px` : isLookingAtEachOther ? `${55}px` : `${45 + purplePos.faceX}px`,
                top: (passwordLength > 0 && showPassword) ? `${35}px` : isLookingAtEachOther ? `${65}px` : `${40 + purplePos.faceY}px`,
              }}
            >
              <EyeBall 
                size={18} 
                pupilSize={7} 
                maxDistance={5} 
                eyeColor="white" 
                pupilColor="#2D2D2D" 
                isBlinking={isPurpleBlinking}
                forceLookX={(passwordLength > 0 && showPassword) ? (isPurplePeeking ? 4 : -4) : isLookingAtEachOther ? 3 : undefined}
                forceLookY={(passwordLength > 0 && showPassword) ? (isPurplePeeking ? 5 : -4) : isLookingAtEachOther ? 4 : undefined}
              />
              <EyeBall 
                size={18} 
                pupilSize={7} 
                maxDistance={5} 
                eyeColor="white" 
                pupilColor="#2D2D2D" 
                isBlinking={isPurpleBlinking}
                forceLookX={(passwordLength > 0 && showPassword) ? (isPurplePeeking ? 4 : -4) : isLookingAtEachOther ? 3 : undefined}
                forceLookY={(passwordLength > 0 && showPassword) ? (isPurplePeeking ? 5 : -4) : isLookingAtEachOther ? 4 : undefined}
              />
            </div>
          </div>

          {/* Black tall rectangle character - Middle layer */}
          <div 
            ref={blackRef}
            className="absolute bottom-0 transition-all duration-700 ease-in-out"
            style={{
              left: '240px',
              width: '120px',
              height: '310px',
              backgroundColor: '#2D2D2D',
              borderRadius: '8px 8px 0 0',
              zIndex: 2,
              transform: (passwordLength > 0 && showPassword)
                ? `skewX(0deg)`
                : isLookingAtEachOther
                  ? `skewX(${(blackPos.bodySkew || 0) * 1.5 + 10}deg) translateX(20px)`
                  : (isTyping || isHidingPassword)
                    ? `skewX(${(blackPos.bodySkew || 0) * 1.5}deg)` 
                    : `skewX(${blackPos.bodySkew || 0}deg)`,
              transformOrigin: 'bottom center',
            }}
          >
            {/* Eyes */}
            <div 
              className="absolute flex gap-6 transition-all duration-700 ease-in-out"
              style={{
                left: (passwordLength > 0 && showPassword) ? `${10}px` : isLookingAtEachOther ? `${32}px` : `${26 + blackPos.faceX}px`,
                top: (passwordLength > 0 && showPassword) ? `${28}px` : isLookingAtEachOther ? `${12}px` : `${32 + blackPos.faceY}px`,
              }}
            >
              <EyeBall 
                size={16} 
                pupilSize={6} 
                maxDistance={4} 
                eyeColor="white" 
                pupilColor="#2D2D2D" 
                isBlinking={isBlackBlinking}
                forceLookX={(passwordLength > 0 && showPassword) ? -4 : isLookingAtEachOther ? 0 : undefined}
                forceLookY={(passwordLength > 0 && showPassword) ? -4 : isLookingAtEachOther ? -4 : undefined}
              />
              <EyeBall 
                size={16} 
                pupilSize={6} 
                maxDistance={4} 
                eyeColor="white" 
                pupilColor="#2D2D2D" 
                isBlinking={isBlackBlinking}
                forceLookX={(passwordLength > 0 && showPassword) ? -4 : isLookingAtEachOther ? 0 : undefined}
                forceLookY={(passwordLength > 0 && showPassword) ? -4 : isLookingAtEachOther ? -4 : undefined}
              />
            </div>
          </div>

          {/* Orange semi-circle character - Front left */}
          <div 
            ref={orangeRef}
            className="absolute bottom-0 transition-all duration-700 ease-in-out"
            style={{
              left: '0px',
              width: '240px',
              height: '200px',
              zIndex: 3,
              backgroundColor: '#FF9B6B',
              borderRadius: '120px 120px 0 0',
              transform: (passwordLength > 0 && showPassword) ? `skewX(0deg)` : `skewX(${orangePos.bodySkew || 0}deg)`,
              transformOrigin: 'bottom center',
            }}
          >
            {/* Eyes - just pupils, no white */}
            <div 
              className="absolute flex gap-8 transition-all duration-200 ease-out"
              style={{
                left: (passwordLength > 0 && showPassword) ? `${50}px` : `${82 + (orangePos.faceX || 0)}px`,
                top: (passwordLength > 0 && showPassword) ? `${85}px` : `${90 + (orangePos.faceY || 0)}px`,
              }}
            >
              <Pupil size={12} maxDistance={5} pupilColor="#2D2D2D" forceLookX={(passwordLength > 0 && showPassword) ? -5 : undefined} forceLookY={(passwordLength > 0 && showPassword) ? -4 : undefined} />
              <Pupil size={12} maxDistance={5} pupilColor="#2D2D2D" forceLookX={(passwordLength > 0 && showPassword) ? -5 : undefined} forceLookY={(passwordLength > 0 && showPassword) ? -4 : undefined} />
            </div>
          </div>

          {/* Yellow tall rectangle character - Front right */}
          <div 
            ref={yellowRef}
            className="absolute bottom-0 transition-all duration-700 ease-in-out"
            style={{
              left: '310px',
              width: '140px',
              height: '230px',
              backgroundColor: '#E8D754',
              borderRadius: '70px 70px 0 0',
              zIndex: 4,
              transform: (passwordLength > 0 && showPassword) ? `skewX(0deg)` : `skewX(${yellowPos.bodySkew || 0}deg)`,
              transformOrigin: 'bottom center',
            }}
          >
            {/* Eyes - just pupils, no white */}
            <div 
              className="absolute flex gap-6 transition-all duration-200 ease-out"
              style={{
                left: (passwordLength > 0 && showPassword) ? `${20}px` : `${52 + (yellowPos.faceX || 0)}px`,
                top: (passwordLength > 0 && showPassword) ? `${35}px` : `${40 + (yellowPos.faceY || 0)}px`,
              }}
            >
              <Pupil size={12} maxDistance={5} pupilColor="#2D2D2D" forceLookX={(passwordLength > 0 && showPassword) ? -5 : undefined} forceLookY={(passwordLength > 0 && showPassword) ? -4 : undefined} />
              <Pupil size={12} maxDistance={5} pupilColor="#2D2D2D" forceLookX={(passwordLength > 0 && showPassword) ? -5 : undefined} forceLookY={(passwordLength > 0 && showPassword) ? -4 : undefined} />
            </div>
            {/* Horizontal line for mouth */}
            <div 
              className="absolute w-20 h-[4px] bg-[#2D2D2D] rounded-full transition-all duration-200 ease-out"
              style={{
                left: (passwordLength > 0 && showPassword) ? `${10}px` : `${40 + (yellowPos.faceX || 0)}px`,
                top: (passwordLength > 0 && showPassword) ? `${88}px` : `${88 + (yellowPos.faceY || 0)}px`,
              }}
            />
          </div>
        </div>
      );
    };

    // InteractiveHoverButton component
    const InteractiveHoverButton = React.forwardRef(({ text = "Button", icon, className, ...props }, ref) => {
      return (
        <button
          ref={ref}
          className={`group relative cursor-pointer overflow-hidden rounded-full border bg-background px-6 py-2 text-center font-semibold ${className}`}
          {...props}
        >
          <span className="inline-block transition-all duration-300 group-hover:translate-x-12 group-hover:opacity-0">
            {text}
          </span>
          <div className="absolute inset-0 z-10 flex items-center justify-center gap-2 bg-primary text-white opacity-0 transition-all duration-300 group-hover:opacity-100 rounded-full">
            <span>{text}</span>
            {icon || <ArrowRight className="h-4 w-4" />}
          </div>
        </button>
      );
    });

    InteractiveHoverButton.displayName = "InteractiveHoverButton";

    // Eye and EyeOff components
    const Eye = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    );

    const EyeOff = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
        <line x1="2" x2="22" y1="2" y2="22"></line>
      </svg>
    );

    const ArrowRight = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14"></path>
        <path d="m12 5 7 7-7 7"></path>
      </svg>
    );

    // LoginPage component
    const LoginPage = () => {
      const [showPassword, setShowPassword] = useState(false);
      const [isTyping, setIsTyping] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsLoading(true);
        setError("");
        // Simulate form submission
        setTimeout(() => {
          setIsLoading(false);
        }, 1000);
      };

      const handleGoogleSignIn = () => {
        // Simulate Google sign-in
        console.log("Google sign-in clicked");
      };

      return (
        <div className="min-h-screen max-h-screen overflow-hidden grid lg:grid-cols-2">
          {/* Left Content Section with Animated Characters */}
          <div className="relative hidden lg:flex flex-col justify-between bg-gradient-to-br from-gray-400 via-gray-500 to-gray-600 dark:from-white/90 dark:via-white/80 dark:to-white/70 p-12 text-white dark:text-gray-900">
            <div className="relative z-20">
              <a
                href="/"
                className="flex items-center gap-2 text-lg font-semibold"
              >
                <img
                  src="https://i.postimg.cc/nLrDYrHW/icon.png"
                  alt="CareerCompass logo"
                  width={32}
                  height={32}
                  className="bg-white/10 backdrop-blur-sm p-1 rounded-lg"
                />
                <span>CareerCompass</span>
              </a>
            </div>

            <div className="relative z-20 flex items-end justify-center h-[500px]">
              <AnimatedCharacters
                isTyping={isTyping}
                showPassword={showPassword}
                passwordLength={password.length}
              />
            </div>

            <div className="relative z-20 flex items-center gap-8 text-sm text-gray-600 dark:text-gray-700">
              <a
                href="#"
                className="hover:text-gray-900 dark:hover:text-black transition-colors"
              >
                Privacy Policy
              </a>
              <a
                href="#"
                className="hover:text-gray-900 dark:hover:text-black transition-colors"
              >
                Terms of Service
              </a>
            </div>

            {/* Decorative elements */}
            <div className="absolute inset-0 bg-grid-white bg-[size:20px_20px]" />
            <div className="absolute top-1/4 right-1/4 size-64 bg-gray-400/20 dark:bg-gray-300/30 rounded-full blur-3xl" />
            <div className="absolute bottom-1/4 left-1/4 size-96 bg-gray-300/20 dark:bg-gray-200/20 rounded-full blur-3xl" />
          </div>

          {/* Right Login Section */}
          <div className="flex items-center justify-center p-8 bg-background">
            <div className="w-full max-w-[420px]">
              {/* Mobile Logo */}
              <div className="lg:hidden flex items-center justify-center gap-2 text-lg font-semibold mb-12">
                <img
                  src="https://i.postimg.cc/nLrDYrHW/icon.png"
                  alt="CareerCompass logo"
                  width={32}
                  height={32}
                  className="dark:bg-white dark:p-1 dark:rounded-md"
                />
                <span>CareerCompass</span>
              </div>

              {/* Header */}
              <div className="text-center mb-10">
                <h1 className="text-3xl font-bold tracking-tight mb-2">
                  Welcome back!
                </h1>
                <p className="text-muted-foreground text-sm">
                  Please enter your details
                </p>
              </div>

              {/* Login Form */}
              <form onSubmit={handleSubmit} className="space-y-5">
                <div className="space-y-2">
                  <label htmlFor="email" className="text-sm font-medium">
                    Email
                  </label>
                  <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autoComplete="off"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    onFocus={() => setIsTyping(true)}
                    onBlur={() => setIsTyping(false)}
                    className="h-12 w-full bg-background border border-border/60 focus:border-primary rounded-md px-4 focus:outline-none focus:ring-2 focus:ring-primary/50"
                  />
                </div>

                <div className="space-y-2">
                  <label htmlFor="password" className="text-sm font-medium">
                    Password
                  </label>
                  <div className="relative">
                    <input
                      id="password"
                      type={showPassword ? "text" : "password"}
                      placeholder="••••••••"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="h-12 w-full pr-10 bg-background border border-border/60 focus:border-primary rounded-md px-4 focus:outline-none focus:ring-2 focus:ring-primary/50"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors"
                    >
                      {showPassword ? (
                        <EyeOff />
                      ) : (
                        <Eye />
                      )}
                    </button>
                  </div>
                </div>

                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <input type="checkbox" id="remember" className="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" />
                    <label
                      htmlFor="remember"
                      className="text-sm font-normal cursor-pointer"
                    >
                      Remember for 30 days
                    </label>
                  </div>
                  <a
                    href="#"
                    className="text-sm text-primary hover:underline font-medium"
                  >
                    Forgot password?
                  </a>
                </div>

                {error && (
                  <div className="p-3 text-sm text-destructive bg-destructive/10 border border-destructive/30 rounded-lg">
                    {error}
                  </div>
                )}

                <InteractiveHoverButton
                  type="submit"
                  text={isLoading ? "Signing in..." : "Log in"}
                  className="w-full h-12 text-base font-medium"
                  disabled={isLoading}
                />
              </form>

              {/* Social Login */}
              <div className="mt-6">
                <InteractiveHoverButton
                  type="button"
                  text="Log in with Google"
                  className="w-full h-12 border-border/60"
                  onClick={handleGoogleSignIn}
                  icon={
                    <svg
                      className="h-5 w-5"
                      aria-hidden="true"
                      focusable="false"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 488 512"
                    >
                      <path
                        fill="currentColor"
                        d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-76.2 76.2C322.3 113.2 289.4 96 248 96c-88.8 0-160.1 71.9-160.1 160.1s71.3 160.1 160.1 160.1c98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 26.9 3.9 41.4z"
                      ></path>
                    </svg>
                  }
                />
              </div>

              {/* Sign Up Link */}
              <div className="text-center text-sm text-muted-foreground mt-8">
                Don't have an account? <a href="#" className="text-foreground font-medium hover:underline">Sign Up</a>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render the LoginPage component
    ReactDOM.render(<LoginPage />, document.getElementById('root'));
  </script>
</body>
</html>
