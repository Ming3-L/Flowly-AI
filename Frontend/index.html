<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowly - AI Workflow System</title>
    <!-- Optional runtime config (static hosting / Electron). Must load before app bundle. -->
    <script src="./runtime-config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // GitHub Pages SPA fallback: restore path saved by public/404.html
      ;(function () {
        try {
          const p = sessionStorage.getItem('__flowly_redirect_path__')
          if (p) {
            sessionStorage.removeItem('__flowly_redirect_path__')
            history.replaceState(null, '', p)
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
